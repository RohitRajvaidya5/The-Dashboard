[project]
name = "internetspeedproject"
version = "0.1.0"
description = "Real-time network bandwidth monitor and on-demand Ookla speed test dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "jinja2>=3.1.6",
    "psutil>=7.2.2",
    "speedtest-cli>=2.1.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
internetspeedproject = "internetspeedproject:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
